name: Download YouTube MP4
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube URL'
        required: true
      filename:
        description: 'Output filename (no extension)'
        required: true
        default: 'video'
      quality:
        description: 'Quality (720, 480, 360, audio)'
        required: false
        default: '720'

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg + jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg jq curl
      - name: Download via cobalt.tools API
        run: |
          mkdir -p downloads
          NAME="${{ inputs.filename }}"
          Q="${{ inputs.quality }}"
          URL="${{ inputs.url }}"

          # Cobalt.tools community instances (try several)
          INSTANCES=(
            "https://api.cobalt.tools"
            "https://co.eepy.today/api"
            "https://cobalt-backend.canine.tools"
            "https://api.cobalt.canine.tools"
            "https://capi.oak.li"
            "https://dwnld.nichind.dev"
          )

          if [ "$Q" = "audio" ]; then
            BODY=$(jq -nc --arg u "$URL" '{url:$u,downloadMode:"audio",audioFormat:"mp3",audioBitrate:"320"}')
            EXT="mp3"
          else
            BODY=$(jq -nc --arg u "$URL" --arg q "$Q" '{url:$u,videoQuality:$q,filenameStyle:"basic"}')
            EXT="mp4"
          fi
          echo "Body: $BODY"

          DOWNLOAD_URL=""
          for API in "${INSTANCES[@]}"; do
            echo "=== trying $API ==="
            RESP=$(curl -s -X POST "$API/" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -H "User-Agent: Mozilla/5.0" \
              --data "$BODY" --max-time 30 || echo '{}')
            echo "Response: ${RESP:0:300}"
            STATUS=$(echo "$RESP" | jq -r '.status // ""')
            if [ "$STATUS" = "tunnel" ] || [ "$STATUS" = "redirect" ] || [ "$STATUS" = "stream" ]; then
              DOWNLOAD_URL=$(echo "$RESP" | jq -r '.url')
              echo "Got tunnel URL from $API"
              break
            fi
          done

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::No instance returned a usable URL"
            exit 1
          fi

          curl -sL "$DOWNLOAD_URL" -o "downloads/${NAME}.${EXT}" --max-time 600
          ls -lh downloads/
          SIZE=$(stat -c%s "downloads/${NAME}.${EXT}")
          echo "Size: $SIZE bytes"
          if [ "$SIZE" -gt 99000000 ]; then
            echo "::error::File too large for git (>99MB)"
            exit 1
          fi
          if [ "$SIZE" -lt 10000 ]; then
            echo "::error::File too small, likely error response"
            head -c 500 "downloads/${NAME}.${EXT}"
            exit 1
          fi
          ls -lh downloads/
          SIZE=$(stat -c%s downloads/${NAME}.* 2>/dev/null | head -1)
          echo "Size: $SIZE bytes"
          if [ "$SIZE" -gt 99000000 ]; then
            echo "::error::File too large for git (>99MB). Try lower quality."
            exit 1
          fi
      - name: Commit
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add downloads/
          git diff --staged --quiet || git commit -m "download: ${{ inputs.filename }}"
          git push
