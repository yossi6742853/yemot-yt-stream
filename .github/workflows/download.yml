name: Download YouTube MP4
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube URL'
        required: true
      filename:
        description: 'Output filename (no extension)'
        required: true
        default: 'video'
      quality:
        description: 'Quality (720, 480, 360, audio)'
        required: false
        default: '720'

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp + ffmpeg + deno
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg unzip curl
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          pip install -q --upgrade yt-dlp
      - name: Download
        env:
          YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
        run: |
          mkdir -p downloads
          NAME="${{ inputs.filename }}"
          Q="${{ inputs.quality }}"
          COOKIE_FLAG=""
          if [ -n "$YT_COOKIES_B64" ]; then
            echo "$YT_COOKIES_B64" | base64 -d > /tmp/cookies.txt
            COOKIE_FLAG="--cookies /tmp/cookies.txt"
          fi
          COMMON="$COOKIE_FLAG --extractor-args youtube:player_client=tv_simply,mweb,web_safari,ios,android_vr --user-agent Mozilla/5.0"
          if [ "$Q" = "audio" ]; then
            yt-dlp $COMMON -x --audio-format mp3 --audio-quality 0 -o "downloads/${NAME}.%(ext)s" "${{ inputs.url }}"
          else
            yt-dlp $COMMON -f "bestvideo[height<=${Q}]+bestaudio/best[height<=${Q}]/best" \
              --merge-output-format mp4 \
              -o "downloads/${NAME}.%(ext)s" "${{ inputs.url }}"
          fi
          ls -lh downloads/
          SIZE=$(stat -c%s downloads/${NAME}.* 2>/dev/null | head -1)
          echo "Size: $SIZE bytes"
          if [ "$SIZE" -gt 99000000 ]; then
            echo "::error::File too large for git (>99MB). Try lower quality."
            exit 1
          fi
      - name: Commit
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add downloads/
          git diff --staged --quiet || git commit -m "download: ${{ inputs.filename }}"
          git push
